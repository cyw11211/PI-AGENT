<div class="layout">

  <!-- ================= 左侧栏 ================= -->
  <aside class="sidebar" id="sidebar">
    <div class="sb-head">
      <span class="brand">Pi Web</span>
      <div class="sb-head-actions">
        <button class="btn btn-new" id="btn-new" title="新建会话"><svg class="i"><use href="#i-plus"/></svg>新建</button>
        <button class="btn btn-icon" id="btn-search" title="搜索会话"><svg class="i"><use href="#i-search"/></svg></button>
      </div>
    </div>

    <div class="sb-search" id="search-box" hidden>
      <input id="search-input" type="text" placeholder="搜索会话标题…">
    </div>

    <div class="sb-block sb-ws">
      <button class="ws-btn" id="ws-btn" title="切换工作目录">
        <span class="ws-path" id="ws-path"><span style="unicode-bidi:plaintext">~</span></span>
        <svg class="i ws-caret"><use href="#i-chevron-down"/></svg>
      </button>
      <div class="ws-menu" id="ws-menu" hidden></div>
      <div class="sb-git-row sb-wt" id="sb-wt">
        <button class="btn btn-ghost btn-block" id="btn-git-root" title="仅 Git 仓库根目录"><svg class="i"><use href="#i-git"/></svg>仓库根目录</button>
        <button class="btn btn-ghost btn-block" id="btn-worktrees" title="切换 / 新建 / 删除 Git 工作树"><svg class="i"><use href="#i-layers"/></svg>工作树</button>
        <div class="ws-menu" id="wt-menu" hidden></div>
      </div>
    </div>

    <div class="sb-sessions" id="session-list">
      <div class="empty">暂无会话</div>
    </div>

    <div class="sb-block sb-files">
      <div class="files-head">
        <button class="files-toggle" id="files-toggle"><svg class="i caret"><use href="#i-chevron-down"/></svg>文件浏览器</button>
        <div class="files-tools">
          <button class="ico" id="fs-term" title="打开工作区终端"><svg class="i"><use href="#i-terminal"/></svg></button>
          <button class="ico" id="fs-search" title="搜索文件"><svg class="i"><use href="#i-search"/></svg></button>
          <button class="ico" id="fs-upload" title="将文件上传到项目根目录"><svg class="i"><use href="#i-upload"/></svg></button>
          <button class="ico" id="fs-refresh" title="刷新文件浏览器"><svg class="i"><use href="#i-rotate"/></svg></button>
        </div>
      </div>
      <div class="fs-search" id="fs-panel" hidden>
        <div class="fs-search-box">
          <svg class="i"><use href="#i-search"/></svg>
          <input id="fs-query" type="text" placeholder="搜索文件…" aria-label="搜索文件" spellcheck="false">
          <button class="ico xs" id="fs-clear" title="清除搜索"><svg class="i"><use href="#i-x"/></svg></button>
        </div>
        <div class="fs-results" id="fs-results"></div>
      </div>
      <div class="files-tree" id="file-tree"></div>
    </div>

    <div class="sb-foot">
      <button class="foot-btn" id="open-models"><svg class="i"><use href="#i-cpu"/></svg>模型</button>
      <button class="foot-btn" id="open-skills"><svg class="i"><use href="#i-sparkles"/></svg>技能</button>
      <button class="foot-btn" id="open-settings"><svg class="i"><use href="#i-settings"/></svg>设置</button>
    </div>
  </aside>
  <div class="sb-resizer" id="sb-resizer" role="separator" aria-orientation="vertical" tabindex="0" title="拖动调整侧栏宽度（双击复位）"></div>

  <!-- ================= 主区 ================= -->
  <main class="main">
    <header class="topbar">
      <button class="ico" id="toggle-sidebar" title="折叠侧栏"><svg class="i"><use href="#i-panel-left"/></svg></button>
      <button class="tb-btn" id="tb-history"><svg class="i"><use href="#i-clock"/></svg>完整历史</button>
      <button class="tb-btn" id="tb-title"><svg class="i"><use href="#i-pen"/></svg>生成标题</button>
      <button class="tb-btn" id="tb-system"><svg class="i"><use href="#i-file-text"/></svg>系统</button>
      <button class="tb-btn" id="tb-tools"><svg class="i"><use href="#i-wrench"/></svg>工具</button>
      <div class="tb-spacer"></div>
      <!-- 点计量条展开用量详情（会话信息 / 项目信息 | 消息 | Token），再点收起；
           点别处或 Esc 也收。面板挂在顶栏下沿右侧，见 app.css 的 .stats-pop。 -->
      <div class="meter" id="meter" role="button" tabindex="0" title="点击查看用量详情">
        <span title="输入 token"><svg class="i"><use href="#i-arrow-up"/></svg><b id="m-in">0</b></span>
        <span title="输出 token"><svg class="i"><use href="#i-arrow-down"/></svg><b id="m-out">0</b></span>
        <span title="缓存读取"><svg class="i"><use href="#i-cache"/></svg><b id="m-cache">0</b></span>
        <span title="上下文占用"><svg class="i"><use href="#i-gauge"/></svg><b id="m-pct">0%</b>/<b id="m-window">—</b></span>
      </div>
      <div class="stats-pop" id="stats-pop" hidden></div>
    </header>

    <!-- 消息流 + 右侧导轨。导轨放在 .stream 里（要跟着滚动容器尺寸走），位置由 renderMini 按 scrollTop 顶住。 -->
    <section class="stream" id="stream">
      <!-- 「加载更早的消息」：会话历史按页从磁盘 jsonl 取，最新一页之外的按需往上加载。
           放在 #stream-inner 外面，所以往上插历史页时它始终留在最上面，也不参与滚动位置补偿。 -->
      <button class="hist-more" id="hist-more" type="button" hidden></button>
      <div class="stream-inner" id="stream-inner"></div>
      <!-- 右侧导轨：用户消息一个小方块 + 表示当前视口的可拖动滑块。 -->
      <div class="mini" id="mini" hidden>
        <div class="mini-rail" id="mini-rail">
          <div class="mini-marks" id="mini-marks"></div>
          <div class="mini-thumb" id="mini-thumb" hidden></div>
        </div>
        <div class="mini-tip" id="mini-tip" hidden></div>
      </div>
    </section>

    <div class="composer" id="composer">
      <!-- 「回到底部」：只在用户往上翻离开底部时浮出（离开 >200px），有新消息时带未读计数。
           挂在 .composer（position:relative）上沿，避开 body zoom 对 fixed 坐标的干扰。 -->
      <button class="jump-bottom" id="jump-bottom" type="button" hidden>
        <svg class="i"><use href="#i-arrow-down"/></svg>回到底部<b class="jb-count" id="jb-count" hidden>0</b>
      </button>
      <!-- 输入框上方那行「现在在干什么」：跑工具显示工具名 + 输出末行，等模型显示等待中 -->
      <div class="act-line" id="act-line" hidden>
        <svg class="i spin"><use href="#i-spinner"/></svg>
        <span class="act-txt" id="act-txt"></span>
      </div>
      <div class="attach-strip" id="attach-strip" hidden></div>
      <!-- pi 扩展用 setWidget 上报的状态条（placement=aboveEditor） -->
      <div class="widgets" id="widgets-above" hidden></div>
      <div class="composer-box" id="composer-box">
        <textarea id="input" rows="1" placeholder="输入消息…"></textarea>
        <div class="composer-acts">
          <button class="btn btn-send" id="btn-send"><svg class="i"><use href="#i-arrow-right"/></svg>发送</button>
          <button class="btn btn-steer" id="btn-steer" hidden title="立即引导（Enter）"><svg class="i"><use href="#i-arrow-right"/></svg>引导</button>
          <button class="btn btn-follow" id="btn-follow" hidden title="在 Agent 完成后排队此消息（Alt+Enter）"><svg class="i"><use href="#i-arrow-up"/></svg>后续消息</button>
        </div>
      </div>
      <div class="composer-tools" id="composer-tools">
        <button class="ico" id="btn-attach" title="插入图片（也可直接粘贴 / 拖入）"><svg class="i"><use href="#i-image"/></svg></button>
        <button class="model-btn" id="model-btn" title="选择模型">
          <svg class="i"><use href="#i-cpu"/></svg><span id="model-name">—</span>
          <svg class="i chev"><use href="#i-chevron-up"/></svg>
        </button>
        <div class="composer-mid">
          <button class="chip" id="chip-think" title="思考等级"><svg class="i"><use href="#i-bulb"/></svg><span id="chip-think-txt">medium</span></button>
          <button class="chip" id="chip-preset" title="工具预设"><svg class="i"><use href="#i-wrench"/></svg><span id="chip-preset-txt">default</span></button>
          <button class="chip" id="chip-compact" title="压缩上下文"><svg class="i"><use href="#i-compress"/></svg><span>压缩</span></button>
        </div>
        <div class="composer-end">
          <button class="btn btn-stop" id="btn-stop" hidden><svg class="i"><use href="#i-square"/></svg>停止</button>
          <button class="ico" id="btn-sound" title="回合结束提示音"><svg class="i"><use href="#i-volume"/></svg></button>
        <button class="ico" id="btn-panel" title="显示/隐藏文件面板"><svg class="i"><use href="#i-panel-right"/></svg></button>
          <button class="ico" id="btn-devtools" title="开发者工具"><svg class="i"><use href="#i-devtools"/></svg></button>
        </div>
      </div>
      <!-- pi 扩展用 setWidget 上报的状态条（placement=belowEditor） -->
      <div class="widgets widgets-below" id="widgets-below" hidden></div>
      <div class="model-pop" id="model-pop" hidden></div>
      <div class="chip-pop" id="chip-pop" hidden></div>
      <!-- 斜杠命令面板：输入 / 时弹出，内置 6 个 + pi 报回来的扩展/提示词/技能 -->
      <div class="slash-pop" id="slash-pop" hidden>
        <div class="slash-head">
          <span class="slash-title" id="slash-title">斜杠命令</span>
          <span class="slash-key">Tab / Enter</span>
        </div>
        <div class="slash-body" id="slash-body"></div>
      </div>
    </div>

    <footer class="statusbar">
      <span id="st-left">·</span>
      <div class="tb-spacer"></div>
      <span id="st-right"></span>
    </footer>
  </main>

  <!-- ============ 右侧面板：文件 / 网页查看器 ============
       顶部页签 → 工具条（路径 · 语言行数大小 · 绿点监视 · 视图模式 · 提及 · 换行 · 另存为）→ 内容区。
       宽度由 --right-panel-width 控制，拖 #rp-resizer 改，localStorage 记住。
       能同时开多个页签，作用同 pi-web 的右侧 FileViewer。 -->
  <div class="rp-resizer" id="rp-resizer" hidden role="separator" aria-orientation="vertical"
       tabindex="0" title="拖动调整宽度（双击复位）"></div>
  <aside class="right-panel" id="right-panel" hidden aria-label="文件面板">
    <div class="rp-head">
      <div class="rp-tabs" id="rp-tabs" role="tablist"></div>
      <button class="rp-ico" id="rp-close" type="button" title="关闭面板"><svg class="i"><use href="#i-x"/></svg></button>
    </div>
    <div class="rp-toolbar" id="rp-toolbar">
      <span class="rp-path" id="rp-path"></span>
      <span class="rp-meta" id="rp-meta"></span>
      <span class="rp-live" id="rp-live" hidden title="正在监视文件变化"></span>
      <div class="rp-ctrls">
        <div class="rp-modes" id="rp-modes"></div>
        <div class="rp-acts">
          <button class="rp-ico" id="rp-mention" type="button" title="插入文件路径"><svg class="i"><use href="#i-at"/></svg></button>
          <button class="rp-ico" id="rp-wrap" type="button" title="自动换行"><svg class="i"><use href="#i-wrap"/></svg></button>
        </div>
        <button class="rp-ico" id="rp-download" type="button" title="另存为…"><svg class="i"><use href="#i-download"/></svg></button>
      </div>
    </div>
    <div class="rp-body" id="rp-body"></div>
  </aside>
  <div class="rp-backdrop" id="rp-backdrop"></div>
</div>

<!-- ================= 目录选择（工作目录 →「+ 自定义路径…」） ================= -->
<div class="modal" id="dir-pick" hidden>
  <div class="modal-box dir-box">
    <div class="modal-head">
      <div class="modal-title">选择目录</div>
      <button class="ico" id="dp-close" type="button" title="关闭"><svg class="i"><use href="#i-x"/></svg></button>
    </div>
    <div class="dp-bar">
      <button class="ico" id="dp-up" type="button" title="上一级"><svg class="i"><use href="#i-chevron-up"/></svg></button>
      <input type="text" id="dp-path" spellcheck="false" autocomplete="off">
      <button class="btn btn-ghost" id="dp-go" type="button">转到</button>
    </div>
    <div class="dp-list" id="dp-list"></div>
    <div class="modal-foot">
      <button class="btn btn-ghost" id="dp-cancel" type="button">取消</button>
      <button class="btn btn-primary" id="dp-ok" type="button">选择此文件夹</button>
    </div>
  </div>
</div>

<!-- ================= 设置面板 ================= -->
<div class="modal" id="modal" hidden>
  <div class="modal-box">
    <div class="modal-head">
      <div class="modal-title">设置</div>
      <div class="tabs" id="modal-tabs"></div>
      <button class="ico" id="modal-close"><svg class="i"><use href="#i-x"/></svg></button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot" id="modal-foot" hidden></div>
  </div>
</div>

<!-- 选中文字浮窗（「设置 → 常规 → 对话」可关） -->
<div class="sel-pop" id="sel-pop" hidden></div>

<div class="toast-wrap" id="toasts"></div>

<script src="/vendor/highlight.min.js?v=1"></script>
<script src="/vendor/hljs-powershell.min.js?v=1"></script>
<script src="/app.js?v=19"></script>
</body>
</html>
